name: Cloudflare to MailRu Bridge

on:
  schedule:
    # Обновление каждые 12 часов
    - cron: '0 */12 * * *' 
  workflow_dispatch: {} 

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: 🍄 Сборка и Ультра-Чистка "Белого Гриба"
        run: |
          # 1. Забираем основной мост из Cloudflare
          curl -L "https://stella-proxy-all.vehesslav.workers.dev" -o stella_bridge.txt || touch stella_bridge.txt
          
          # 2. Создаем список всех 28 источников
          cat <<EOF > sources.txt
          https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Cable.txt
          https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt
          https://raw.githubusercontent.com/liMilCo/v2r/refs/heads/main/all_configs.txt
          https://raw.githubusercontent.com/STR97/STRUGOV/refs/heads/main/STR.BYPASS
          https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt
          https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt
          https://raw.githubusercontent.com/LowiKLive/BypassWhitelistRu/refs/heads/main/WhiteList-Bypass_Ru.txt
          https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/26.txt
          https://raw.githubusercontent.com/55prosek-lgtm/vpn_config_for_russia/refs/heads/main/whitelist.txt
          https://raw.githubusercontent.com/vlesscollector/vlesscollector/refs/heads/main/vless_configs.txt
          https://raw.githubusercontent.com/Kirillo4ka/vpn-configs-for-russia/refs/heads/main/Vless-Rus-Mobile-White-List.txt
          https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass-unsecure/bypass-unsecure-all.txt
          https://raw.githubusercontent.com/FLEXIY0/matryoshka-vpn/main/configs/russia_whitelist.txt
          https://bp.wl.free.nf/confs/selected.txt
          https://bp.wl.free.nf/confs/wl.txt
          https://bp.wl.free.nf/confs/merged.txt
          https://raw.githubusercontent.com/SilentGhostCodes/WhiteListVpn/refs/heads/main/config.txt
          https://etoneya.a9fm.site/whitelist
          https://raw.githubusercontent.com/LimeHi/LimeVPN/refs/heads/main/LimeVPN.txt
          https://catkts.qzz.io/vpn-service/catvpn/fornekobox.txt
          https://raw.githubusercontent.com/officialdakari/psychic-octo-tribble/refs/heads/main/subwl.txt
          https://raw.githubusercontent.com/RKPchannel/RKP_bypass_configs/refs/heads/main/configs
          https://raw.githubusercontent.com/Ai123999/WhiteeListSub/refs/heads/main/whitelistkeys
          https://raw.githubusercontent.com/Ai123999/WhiteKeys/refs/heads/main/WhiteKeys
          https://storage.yandexcloud.net/cid-vpn/whitelist.txt
          https://raw.githubusercontent.com/FalerChannel/FalerChannel/refs/heads/main/configs
          https://raw.githubusercontent.com/xcom024/vless/refs/heads/main/list.txt
          EOF

          # 3. Скачиваем всё в сырой файл
          touch raw_list.txt
          while read -r line; do
            echo "Загрузка: $line"
            curl -sSL --connect-timeout 8 --max-time 12 -A "v2rayNG/1.8.5" "$line" >> raw_list.txt || echo "Пропуск: $line"
          done < sources.txt
          
          # 4. ЧИСТКА: убираем пустые строки, пробелы и удаляем ДУБЛИКАТЫ (sort -u)
          grep -v '^[[:space:]]*$' raw_list.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sort -u > white_list.txt
          
          echo "📊 Итоги сборки:"
          echo "Было всего строк: $(wc -l < raw_list.txt)"
          echo "Осталось уникальных: $(wc -l < white_list.txt)"

      - name: 🚀 Отправка очищенных файлов в Облако Mail.ru
        run: |
          # Загружаем основной мост
          curl -T stella_bridge.txt --user "${{ secrets.MAIL_RU_LOGIN }}:${{ secrets.MAIL_RU_PASS }}" "https://webdav.cloud.mail.ru/stella_bridge.txt"
          
          # Загружаем чистый Белый Гриб
          curl -T white_list.txt --user "${{ secrets.MAIL_RU_LOGIN }}:${{ secrets.MAIL_RU_PASS }}" "https://webdav.cloud.mail.ru/white_list.txt"
