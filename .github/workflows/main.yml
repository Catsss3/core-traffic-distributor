name: Stella-Raw-Dump

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Engine (Collect 7k+)
        run: python engine.py

      - name: Push to GitHub
        run: |
          git config --global user.name "Catsss3-Bot"
          git config --global user.email "vehesslav@gmail.com"
          git add distributor.txt
          git commit -m "📦 RAW Dump: Full list for Exclave" || exit 0
          git push origin main

      - name: Push to Mail.ru Cloud
        run: |
          curl -T distributor.txt --user "${{ secrets.MAIL_RU_LOGIN }}:${{ secrets.MAIL_RU_PASS }}" "https://webdav.cloud.mail.ru/distributor.txt"