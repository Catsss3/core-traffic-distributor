name: Global Proxy Factory
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Set up Python & Go
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - uses: actions/setup-go@v4
        with: { go-version: '1.21' }

      - name: Install Dependencies
        run: pip install aiohttp tqdm requests colorama rich psutil

      # ЭТАП 1: Поиск (raw_configs.txt)
      - name: Step 1 - Search Engine
        run: python engine.py

      # ЭТАП 2: TCP Чекинг (alive_tcp_full.txt)
      - name: Step 2 - TCP Checker
        run: |
          cd tcp_checker
          go build -o tcp_checker_bin tcp_checker.go
          ./tcp_checker_bin
          cd ..

      # ЭТАП 3: Xray Проверка (distributor.txt)
      - name: Step 3 - Xray Reality Check
        run: |
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip xray && chmod +x xray
          git clone https://github.com/limingda1212/XrayChecker.git
          cp xray XrayChecker/xray
          python proxy_manager.py

      # ЭТАП 4: Пуш всех результатов сразу
      - name: Step 4 - Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Stella-Global-Bot"
          git add raw_configs.txt tcp_checker/alive_tcp_full.txt distributor.txt
          git commit -m "Global Sync: Search -> TCP -> Xray | $(date)" || exit 0
          git push