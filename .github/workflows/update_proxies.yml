name: Check and Update Proxies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
      - name: Setup Environment
        run: |
          sudo apt-get install unzip -y
          pip install aiohttp tqdm requests colorama rich
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip xray
          chmod +x xray
          git clone https://github.com/limingda1212/XrayChecker.git
          cp xray XrayChecker/xray
      - name: Run Checker
        run: python3 proxy_manager.py
      - name: Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Stella-Auto"
          git add distributor.txt
          git commit -m "Auto-update via GitHub Actions" || exit 0
          git push