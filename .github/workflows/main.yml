name: Sync Logic

on:
  schedule:
    # 🌙 Запуск в 04:00 утра каждые два дня
    - cron: '0 4 */2 * *' 
  workflow_dispatch: {}

concurrency:
  group: core-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install --quiet requests aiohttp

      - name: Run Engine (Gathering)
        run: python engine.py

      - name: Run Checker (URL Test)
        run: python checker.py

      - name: Deploy to GitHub
        run: |
          git config --global user.name "web-core-bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "🎯 Stella: Full Sync & URL Test (48h Cycle) ✨" || exit 0
          git push origin main

      - name: 🚀 Push to Mail.ru Cloud (White List)
        run: |
          # Отправляем файл через WebDAV. 
          # Файл появится в корне твоего Облака под именем distributor.txt
          curl -T distributor.txt --user "${{ secrets.MAIL_RU_LOGIN }}:${{ secrets.MAIL_RU_PASS }}" "https://webdav.cloud.mail.ru/distributor.txt"
